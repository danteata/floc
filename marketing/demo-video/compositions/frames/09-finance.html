<template>

    <style>

              <div class="fn-leader" id="09-finance-lead-net" style="left:756.5px; top:249.9px; width:1.25px; height:26.35px; transform-origin:50% 0;"></div>
              <div class="fn-tagwrap" style="left:749.7px; top:276.25px; transform:scale(0.625);">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "09-finance";
        var DURATION = 7.5;
        // ids start with a digit, so resolve them by getElementById (not a CSS #selector)
        var q = function (s) { return document.getElementById(s.charAt(0) === "#" ? s.slice(1) : s); };
        var qa = function (s) { return document.querySelectorAll('[data-composition-id="' + ID + '"] ' + s); };
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.2-1.6): docket, statement, window rises and tilts flat
        tl.fromTo(q("#09-finance-panel"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.3, ease: "power3.out" }, 0.1);
        tl.fromTo(q("#09-finance-window"), { opacity: 0, y: 200, rotationX: 16 }, { opacity: 1, y: 0, rotationX: 0, duration: 1.4, ease: "power3.out" }, 0.2);
        tl.fromTo(q("#09-finance-docket-num"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.25);
        tl.fromTo(q("#09-finance-docket-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.35);
        tl.fromTo(q("#09-finance-docket-label"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.45);
        tl.fromTo(qa(".fn-statement .fn-word"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out", stagger: 0.07 }, 0.5);

        // Camera: outer scales about the window centre (612, 382.5), inner counter-translates (T = centre - target, world px)
        var cam = function (S, tx, ty, at, dur) {
          tl.to(q("#09-finance-cam-outer"), { scale: S, duration: dur, ease: "power3.inOut" }, at);
          tl.to(q("#09-finance-cam-inner"), { x: tx, y: ty, duration: dur, ease: "power3.inOut" }, at);
        };
        var callout = function (lead, tag, at, axis) {
          var from = {}, to = { duration: 0.35, ease: "power3.out" };
          from[axis] = 0; to[axis] = 1;
          tl.fromTo(q(lead), from, to, at);
          tl.fromTo(q(tag), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at + 0.18);
        };

        // Scene 2 (1.8-3.4): push to the stat row. The three cards span src x 560-2256 (1696 px), wider than
        // S 2.0 shows (1440 px), so S 1.6 (1800 px) keeps income, expenses and net in frame.
        // Target src (1408, 600) = world (598.4, 255): top edge lands at src y 37.5, inside the capture.
        cam(1.6, 13.6, 127.5, 1.8, 1.0);
        callout("#09-finance-lead-net", "#09-finance-tag-net", 2.65, "scaleY");

        // Scene 3 (3.6-5.6): pan down to Top income. Target src (1180, 1350) = world (501.5, 573.75):
        // shows src x 460-1900, y 900-1800 (bottom edge exactly at the capture's edge).
        cam(2.0, 110.5, -191.25, 3.6, 1.1);
        callout("#09-finance-lead-tithes", "#09-finance-tag-tithes", 4.75, "scaleX");

        // Scene 4 (5.6-7.5): still hold
        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
