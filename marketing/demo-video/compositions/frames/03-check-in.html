<template>
  <div id="root" data-composition-id="03-check-in" data-start="0" data-duration="9" data-width="1920" data-height="1080">
    <style>

      @font-face{font-family:"Fraunces";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/fraunces-latin-500-normal.woff2") format("woff2");}
      @font-face{font-family:"Inter";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");}

      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .ci-ground { background: #FAF7F1; }
      .ci-stage { overflow: hidden; }

      /* docket label */
      .ci-docket { position: absolute; left: 96px; top: 96px; display: flex; align-items: center; gap: 16px;
        font-family: "Inter", sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase; }
      .ci-docket-num { color: #C1153F; }
      .ci-docket-rule { width: 40px; height: 1px; background: #C1153F; transform-origin: 0 50%; }
      .ci-docket-label { color: #716A65; }

      /* statement */
      .ci-statement { position: absolute; left: 96px; top: 290px; width: 460px; margin: 0;
        font-family: "Fraunces", serif; font-weight: 500; font-size: 68px; line-height: 1.05; letter-spacing: -0.02em; color: #1C1917; }
      .ci-word { display: inline-block; }

      /* QR modal card: 770x708 shown at 540 wide (scale 0.7013), centred at (1250, 470) */
      .ci-qr { position: absolute; left: 980px; top: 222px; width: 540px; height: 496.6px; border-radius: 16px; overflow: hidden;
        border: 1px solid #E7E0D4; background: #ffffff; box-shadow: 0 40px 100px -40px rgba(28,25,23,0.40); transform-origin: 50% 50%; }
      .ci-qr img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

      /* depth layer behind the window */
      .ci-panel { position: absolute; left: 560px; top: 76px; width: 1224px; height: 765px;
        background: #F3EEE4; border: 1px solid #E7E0D4; border-radius: 16px; }

      /* screen-window */
      .ci-persp { position: absolute; left: 600px; top: 116px; width: 1224px; height: 765px; perspective: 1800px; }
      .ci-window { position: absolute; inset: 0; border-radius: 16px; border: 1px solid #E7E0D4; overflow: hidden;
        background: #FAF7F1; box-shadow: 0 40px 100px -40px rgba(28,25,23,0.40); transform-origin: 50% 100%; }
      .ci-cam-outer { position: absolute; left: 0; top: 0; width: 1224px; height: 765px; transform-origin: 50% 50%; will-change: transform; }
      .ci-cam-inner { position: absolute; left: 0; top: 0; width: 1224px; height: 765px; will-change: transform; }
      .ci-shot { position: absolute; left: 0; top: 0; width: 1224px; height: 765px; display: block; }

      /* callouts (world coords = source px x 0.425) */
      .ci-leader { position: absolute; background: #C1153F; }
      .ci-tagwrap { position: absolute; transform-origin: 0 0; }
      .ci-tag { display: inline-block; white-space: nowrap; padding: 6px 12px; background: #FAF7F1; border: 1px solid #E7E0D4; border-radius: 6px;
        font-family: "Inter", sans-serif; font-weight: 600; font-size: 17px; line-height: 20px; color: #1C1917;
        box-shadow: 0 6px 18px -10px rgba(28,25,23,0.35); }
    </style>

    <div id="03-check-in-ground" class="clip ci-ground" data-start="0" data-duration="9" data-track-index="0"></div>

    <div id="03-check-in-stage" class="clip ci-stage" data-start="0" data-duration="9" data-track-index="1">
      <div class="ci-docket" id="03-check-in-docket">
        <span class="ci-docket-num" id="03-check-in-docket-num">01</span>
        <span class="ci-docket-rule" id="03-check-in-docket-rule"></span>
        <span class="ci-docket-label" id="03-check-in-docket-label">Sunday</span>
      </div>

      <h1 class="ci-statement" id="03-check-in-statement"><span class="ci-word">Members</span> <span class="ci-word">check</span> <span class="ci-word">themselves</span> <span class="ci-word">in.</span></h1>

      <!-- QR card: later slides left, shrinks to 60% and sits behind the kiosk window -->
      <div class="ci-qr" id="03-check-in-qr"><img src="assets/qr-modal.png" alt="" /></div>

      <!-- QR callout (stage coords): QR right edge src x585 -> 980+585*0.7013 = 1390; QR middle src y355 -> 222+355*0.7013 = 471 -->
      <div class="ci-leader" id="03-check-in-lead-qr" style="left:1395px; top:470px; width:150px; height:2px; transform-origin:0 50%;"></div>
      <div class="ci-tagwrap" style="left:1545px; top:454px;">
        <span class="ci-tag" id="03-check-in-tag-qr">Scan with a phone camera</span>
      </div>

      <div class="ci-panel" id="03-check-in-panel"></div>

      <div class="ci-persp">
        <div class="ci-window" id="03-check-in-window">
          <div class="ci-cam-outer" id="03-check-in-cam-outer">
            <div class="ci-cam-inner" id="03-check-in-cam-inner" data-layout-allow-overflow>
              <img class="ci-shot" src="assets/kiosk-busy.png" alt="" />

              <!-- Camera S 2.1: shows src x 1509-2880, y 0-857 (clear of the empty-state text) (search box right half, counter, list) -->

              <!-- Search box: leader down from bottom edge src (1700, 314) to y 366; tag below -->
              <div class="ci-leader" id="03-check-in-lead-search" style="left:721.94px; top:133.45px; width:1.111px; height:22.2px; transform-origin:50% 0;"></div>
              <div class="ci-tagwrap" style="left:713.6px; top:155.65px; transform:scale(0.4762);">
                <span class="ci-tag" id="03-check-in-tag-search">Or find your name at the kiosk</span>
              </div>

              <!-- "16 checked in" counter: src x 2642-2830, y 68; leader down from src (2736, 95) to y 140; tag right-aligned to src x 2830 -->
              <div class="ci-leader" id="03-check-in-lead-count" style="left:1162.24px; top:40.4px; width:1.111px; height:19.1px; transform-origin:50% 0;"></div>
              <div class="ci-tagwrap" style="left:auto; right:21.25px; top:59.5px; transform-origin:100% 0; transform:scale(0.4762);">
                <span class="ci-tag" id="03-check-in-tag-count">16 checked in</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "03-check-in";
        var DURATION = 9;
        // ids start with a digit, so resolve them by getElementById (not a CSS #selector)
        var q = function (s) { return document.getElementById(s.charAt(0) === "#" ? s.slice(1) : s); };
        var qa = function (s) { return document.querySelectorAll('[data-composition-id="' + ID + '"] ' + s); };
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.2-1.6): docket, statement, QR card rises
        tl.fromTo(q("#03-check-in-docket-num"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.2);
        tl.fromTo(q("#03-check-in-docket-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.3);
        tl.fromTo(q("#03-check-in-docket-label"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.4);
        tl.fromTo(qa(".ci-statement .ci-word"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out", stagger: 0.08 }, 0.45);
        tl.fromTo(q("#03-check-in-qr"), { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 1.3, ease: "power3.out" }, 0.4);

        // Scene 2 (1.8-3.4): callout on the QR
        tl.fromTo(q("#03-check-in-lead-qr"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 1.8);
        tl.fromTo(q("#03-check-in-tag-qr"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.98);

        // Scene 3 (3.6-5.2): callout clears, QR slides left and back to 60%, kiosk window rises in front
        tl.to([q("#03-check-in-lead-qr"), q("#03-check-in-tag-qr")], { opacity: 0, duration: 0.3, ease: "power2.out" }, 3.3);
        // centre (1250,470) -> (540,700)
        tl.to(q("#03-check-in-qr"), { x: -710, y: 230, scale: 0.6, opacity: 0.85, duration: 1.3, ease: "power3.inOut" }, 3.6);
        tl.fromTo(q("#03-check-in-panel"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.3, ease: "power3.out" }, 3.7);
        tl.fromTo(q("#03-check-in-window"), { opacity: 0, y: 200, rotationX: 16 }, { opacity: 1, y: 0, rotationX: 0, duration: 1.4, ease: "power3.out" }, 3.75);

        // Camera: outer scales, inner counter-translates (T = centre - target, world px)
        var cam = function (S, tx, ty, at, dur) {
          tl.to(q("#03-check-in-cam-outer"), { scale: S, duration: dur, ease: "power3.inOut" }, at);
          tl.to(q("#03-check-in-cam-inner"), { x: tx, y: ty, duration: dur, ease: "power3.inOut" }, at);
        };
        var callout = function (lead, tag, at, axis) {
          var from = {}, to = { duration: 0.35, ease: "power3.out" };
          from[axis] = 0; to[axis] = 1;
          tl.fromTo(q(lead), from, to, at);
          tl.fromTo(q(tag), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at + 0.18);
        };

        // Scene 4 (5.2-7.2): push S 1.8 to src centre (2080, 500) = world (884, 212.5)
        cam(2.1, -320.6, 200.4, 5.2, 0.9);
        callout("#03-check-in-lead-search", "#03-check-in-tag-search", 5.9, "scaleY");
        callout("#03-check-in-lead-count", "#03-check-in-tag-count", 6.6, "scaleY");

        // Scene 5 (7.2-9): hold
        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
