<template>
  <div id="root" data-composition-id="07-profile" data-start="0" data-duration="8" data-width="1920" data-height="1080">
    <style>
      @font-face{font-family:"Fraunces";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/fraunces-latin-400-normal.woff2") format("woff2");}
      @font-face{font-family:"Fraunces";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/fraunces-latin-500-normal.woff2") format("woff2");}
      @font-face{font-family:"Inter";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");}

      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .pf-ground { background: #FAF7F1; }
      .pf-stage { overflow: hidden; }

      /* statement */
      .pf-statement { position: absolute; left: 96px; top: 290px; width: 460px; margin: 0;
        font-family: "Fraunces", serif; font-weight: 500; font-size: 64px; line-height: 1.05; letter-spacing: -0.02em; color: #1C1917; }
      .pf-word { display: inline-block; }

      /* depth panel behind the window */
      .pf-panel { position: absolute; left: 560px; top: 76px; width: 1224px; height: 765px;
        background: #F3EEE4; border: 1px solid #E7E0D4; border-radius: 16px; }

      /* screen-window */
      .pf-persp { position: absolute; left: 600px; top: 116px; width: 1224px; height: 765px; perspective: 1800px; }
      .pf-window { position: absolute; inset: 0; border-radius: 16px; border: 1px solid #E7E0D4; overflow: hidden;
        background: #FAF7F1; box-shadow: 0 40px 100px -40px rgba(28,25,23,0.40); transform-origin: 50% 100%; }
      .pf-cam-outer { position: absolute; left: 0; top: 0; width: 1224px; height: 765px; transform-origin: 50% 50%; will-change: transform; }
      .pf-cam-inner { position: absolute; left: 0; top: 0; width: 1224px; height: 765px; will-change: transform; }
      .pf-shot { position: absolute; left: 0; top: 0; width: 1224px; height: 765px; display: block; }

      /* callouts (world coords = source px x 0.425; camera S 1.9, so 2px lines are 1.053 world px and tags scale 1/1.9) */
      .pf-leader { position: absolute; background: #C1153F; }
      .pf-ring { position: absolute; box-sizing: border-box; border: 1.053px solid #C1153F; border-radius: 10.5px; transform-origin: 50% 50%; }
      .pf-tagwrap { position: absolute; transform-origin: 0 0; }
      .pf-tag { display: inline-block; white-space: nowrap; padding: 6px 12px; background: #FAF7F1; border: 1px solid #E7E0D4; border-radius: 6px;
        font-family: "Inter", sans-serif; font-weight: 600; font-size: 17px; line-height: 20px; color: #1C1917;
        box-shadow: 0 6px 18px -10px rgba(28,25,23,0.35); }
    </style>

    <div id="07-profile-ground" class="clip pf-ground" data-start="0" data-duration="8" data-track-index="0"></div>

    <div id="07-profile-stage" class="clip pf-stage" data-start="0" data-duration="8" data-track-index="1">
      <h1 class="pf-statement" id="07-profile-statement"><span class="pf-word">Every</span> <span class="pf-word">absence</span> <span class="pf-word">is</span> <span class="pf-word">noticed.</span></h1>

      <div class="pf-panel" id="07-profile-panel"></div>

      <div class="pf-persp">
        <div class="pf-window" id="07-profile-window">
          <div class="pf-cam-outer" id="07-profile-cam-outer">
            <div class="pf-cam-inner" id="07-profile-cam-inner" data-layout-allow-overflow>
              <img class="pf-shot" src="assets/member-profile.png" alt="" />

              <!-- "11 Missed in a row" card: src x 1663-2065, y 386-547 = world x 706.8-877.6, y 164.05-232.5; ring outset 3.2 world px -->
              <div class="pf-ring" id="07-profile-ring" style="left:703.6px; top:160.85px; width:177.2px; height:74.85px;"></div>
              <div class="pf-leader" id="07-profile-lead-missed" style="left:739.5px; top:236.5px; width:1.053px; height:20px; transform-origin:50% 0;"></div>
              <div class="pf-tagwrap" style="left:733px; top:256.5px; transform:scale(0.5263);">
                <span class="pf-tag" id="07-profile-tag-missed">Counted for you</span>
              </div>

              <!-- Attendance history: third "Absent" badge, right edge src 2032, centre y src 1364 = world (863.6, 579.6); leader runs right -->
              <div class="pf-leader" id="07-profile-lead-history" style="left:866px; top:579.1px; width:26px; height:1.053px; transform-origin:0 50%;"></div>
              <div class="pf-tagwrap" style="left:894px; top:570.65px; transform:scale(0.5263);">
                <span class="pf-tag" id="07-profile-tag-history">Absent, week after week</span>
              </div>

              <!-- "High risk" badge: centre src (1314,1495), bottom src 1515 = world (558.5, 643.9); leader down, tag below -->
              <div class="pf-leader" id="07-profile-lead-risk" style="left:558px; top:646px; width:1.053px; height:20px; transform-origin:50% 0;"></div>
              <div class="pf-tagwrap" style="left:548px; top:666px; transform:scale(0.5263);">
                <span class="pf-tag" id="07-profile-tag-risk">Flagged before it is too late</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "07-profile";
        var DURATION = 8;
        // ids start with a digit, so resolve them by getElementById (not a CSS #selector)
        var q = function (s) { return document.getElementById(s.charAt(0) === "#" ? s.slice(1) : s); };
        var qa = function (s) { return document.querySelectorAll('[data-composition-id="' + ID + '"] ' + s); };
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.2-1.6): statement, window rises and tilts flat
        tl.fromTo(q("#07-profile-panel"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.3, ease: "power3.out" }, 0.1);
        tl.fromTo(q("#07-profile-window"), { opacity: 0, y: 200, rotationX: 16 }, { opacity: 1, y: 0, rotationX: 0, duration: 1.4, ease: "power3.out" }, 0.2);
        tl.fromTo(qa(".pf-statement .pf-word"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out", stagger: 0.08 }, 0.35);

        // Camera: outer scales about the window centre (612, 382.5), inner counter-translates (T = centre - target, world px).
        // At S 1.9 the centre must stay within x 322.1-901.9, y 201.3-563.7 so no edge of the capture shows.
        var cam = function (S, tx, ty, at, dur) {
          tl.to(q("#07-profile-cam-outer"), { scale: S, duration: dur, ease: "power3.inOut" }, at);
          tl.to(q("#07-profile-cam-inner"), { x: tx, y: ty, duration: dur, ease: "power3.inOut" }, at);
        };
        var callout = function (lead, tag, at, axis) {
          var from = {}, to = { duration: 0.35, ease: "power3.out" };
          from[axis] = 0; to[axis] = 1;
          tl.fromTo(q(lead), from, to, at);
          tl.fromTo(q(tag), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at + 0.18);
        };

        // Scene 2 (1.8-3.4): push S 1.9 to the missed card, centre world (792.2, 198.3) clamped to y 201.3
        cam(1.9, -180.2, 181.2, 1.8, 1.0);
        tl.fromTo(q("#07-profile-ring"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 2.6);
        callout("#07-profile-lead-missed", "#07-profile-tag-missed", 2.85, "scaleY");

        // Scene 3 (3.6-5.4): to the attendance history list, centre world (749.7, 567.6) clamped to y 563.7
        cam(1.9, -137.7, -181.2, 3.2, 0.9);
        callout("#07-profile-lead-history", "#07-profile-tag-history", 4.0, "scaleX");

        // Scene 4 (5.6-7.5): across to the engagement card, centre world (474, 563.7)
        cam(1.9, 138, -181.2, 5.2, 0.8);
        callout("#07-profile-lead-risk", "#07-profile-tag-risk", 5.8, "scaleY");

        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
