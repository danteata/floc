<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1c1917; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #faf7f1; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="76.5" data-width="1920" data-height="1080">
      <div id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="7" data-track-index="0"></div>
      <div id="el-02-brand" class="scene" data-composition-id="02-brand" data-composition-src="compositions/frames/02-brand.html" data-start="6.5" data-duration="4.5" data-track-index="1"></div>
      <div id="el-03-check-in" class="scene" data-composition-id="03-check-in" data-composition-src="compositions/frames/03-check-in.html" data-start="10.5" data-duration="9" data-track-index="0"></div>
      <div id="el-04-live" class="scene" data-composition-id="04-live" data-composition-src="compositions/frames/04-live.html" data-start="19" data-duration="6.5" data-track-index="1"></div>
      <div id="el-05-dashboard" class="scene" data-composition-id="05-dashboard" data-composition-src="compositions/frames/05-dashboard.html" data-start="25" data-duration="8" data-track-index="0"></div>
      <div id="el-06-care" class="scene" data-composition-id="06-care" data-composition-src="compositions/frames/06-care.html" data-start="32.5" data-duration="8.5" data-track-index="1"></div>
      <div id="el-07-profile" class="scene" data-composition-id="07-profile" data-composition-src="compositions/frames/07-profile.html" data-start="40.5" data-duration="8" data-track-index="0"></div>
      <div id="el-08-share" class="scene" data-composition-id="08-share" data-composition-src="compositions/frames/08-share.html" data-start="48" data-duration="9" data-track-index="1"></div>
      <div id="el-09-finance" class="scene" data-composition-id="09-finance" data-composition-src="compositions/frames/09-finance.html" data-start="56.5" data-duration="7.5" data-track-index="0"></div>
      <div id="el-10-everything" class="scene" data-composition-id="10-everything" data-composition-src="compositions/frames/10-everything.html" data-start="63.5" data-duration="7" data-track-index="1"></div>
      <div id="el-11-close" class="scene" data-composition-id="11-close" data-composition-src="compositions/frames/11-close.html" data-start="70" data-duration="6.5" data-track-index="0"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // frame transitions: each join is 0.5s, where the next frame starts
      tl.to("#el-01-hook", { scale: 2.2, opacity: 0, filter: "blur(8px)", duration: 0.45, ease: "power3.in" }, 6.5);
      tl.fromTo("#el-02-brand", { scale: 0.6, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 6.5);
      tl.to("#el-02-brand", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10.5);
      tl.fromTo("#el-03-check-in", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10.5);
      tl.to("#el-03-check-in", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 19);
      tl.fromTo("#el-04-live", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 19);
      tl.to("#el-04-live", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 25);
      tl.fromTo("#el-05-dashboard", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 25);
      tl.to("#el-05-dashboard", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.5, ease: "power2.inOut" }, 32.5);
      tl.fromTo("#el-06-care", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 32.5);
      tl.to("#el-06-care", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 40.5);
      tl.fromTo("#el-07-profile", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 40.5);
      tl.to("#el-07-profile", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 48);
      tl.fromTo("#el-08-share", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 48);
      tl.to("#el-08-share", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 56.5);
      tl.fromTo("#el-09-finance", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 56.5);
      tl.to("#el-09-finance", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.5, ease: "power2.inOut" }, 63.5);
      tl.fromTo("#el-10-everything", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 63.5);
      tl.to("#el-10-everything", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 70);
      tl.fromTo("#el-11-close", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 70);
      tl.to({}, { duration: 76.5 }, 0); // full-span anchor
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
